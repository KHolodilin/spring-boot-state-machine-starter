name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    name: Publish to Maven Central and create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version from tag
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Publish to Maven Central
        # -P release enables central-publishing + sources + GPG.
        # maven.test.skip skips re-running tests on the deploy invocation.
        run: mvn -B -ntp deploy -P release -Dmaven.test.skip=true
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Collect main jars for GitHub Release
        run: |
          set -euo pipefail
          mkdir -p gh-release-jars
          for module in \
            state-machine-core \
            state-machine-persistence-jdbc \
            state-machine-queue-memory \
            state-machine-spring-boot-starter
          do
            find "$module/target" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-tests.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-exec.jar' \
              ! -name 'original-*.jar' \
              -exec cp -v {} gh-release-jars/ \;
          done
          ls -la gh-release-jars
          test "$(find gh-release-jars -maxdepth 1 -type f -name '*.jar' | wc -l)" -ge 4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: gh-release-jars/*
