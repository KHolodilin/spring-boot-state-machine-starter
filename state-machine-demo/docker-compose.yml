services:
  postgres:
    image: postgres:16-alpine
    container_name: state-machine-demo-postgres
    environment:
      POSTGRES_DB: statemachine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d statemachine"]
      interval: 5s
      timeout: 3s
      retries: 10
